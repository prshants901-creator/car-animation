<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Day in the Life of a Car</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

    <!-- Sky -->
    <div class="sun"></div>
    <div class="moon"></div>

    <!-- Clouds -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <!-- Title -->
    <div class="title">
        <h1>A Day in the Life of a Car</h1>
        <p>Fundamentals of Animation</p>
    </div>

    <!-- Buildings -->
    <div class="city">
        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>
    </div>

    <!-- Trees -->
    <div class="trees">
        🌳 &nbsp;&nbsp;&nbsp; 🌳 &nbsp;&nbsp;&nbsp; 🌳 &nbsp;&nbsp;&nbsp; 🌳
    </div>

    <!-- Traffic Light -->
    <div class="traffic-light">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
    </div>

    <!-- Road -->
    <div class="road">
        <div class="road-lines"></div>

        <!-- Car -->
        <div class="car">

            <div class="car-body">
                <div class="window front"></div>
                <div class="window back"></div>

                <div class="headlight"></div>
                <div class="taillight"></div>
            </div>

            <div class="wheel wheel1">
                <div class="hub"></div>
            </div>

            <div class="wheel wheel2">
                <div class="hub"></div>
            </div>

        </div>
    </div>

    <!-- Ending -->
    <div class="ending">
        <h2>Journey Completed 🚗</h2>
        <p>Fundamentals of Animation</p>
        <p>Prashant Singh • Shivam</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
